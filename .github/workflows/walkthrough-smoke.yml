name: Walkthrough Smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  walkthrough-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run walkthrough:setup
      - run: npm run walkthrough:smoke

      - name: Upload walkthrough artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
